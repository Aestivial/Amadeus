[project]
name = "amadeus"
version = "0.1.0"
description = "Amadeus - a portable, local AI agent for your terminal (llama.cpp / Ollama), inspired by Steins;Gate."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Aestivial" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "typer>=0.12",
    "pydantic>=2.7",
    "tomli-w>=1.0",
]

[project.scripts]
amadeus = "amadeus.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "respx>=0.21", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amadeus"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
